name: Authorea
description: >-
  Authorea is a collaborative online platform for writing, editing, reviewing,
  and publishing scholarly and scientific documents. Founded in 2012 by Alberto
  Pepe and Nathan Jenkins, it lets researchers co-author articles in rich text
  or LaTeX, manage citations and references, embed data, figures, and code, run
  version-controlled review, and export to journal-specific styles. Authorea was
  acquired by Atypon in 2018 and is now operated as part of John Wiley & Sons,
  hosted on Atypon's Literatum publishing platform, where it supports preprints,
  journal submission, and open collaboration for the research community. It has
  no public developer API today; its earlier REST API was retired after the
  Wiley/Atypon acquisition, and the GitHub organization now publishes only
  document-processing tooling (LaTeXML, Pandoc, TeX styling) rather than API
  client SDKs.
